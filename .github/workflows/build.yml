name: Build LIGHTFINGERS

# This runs automatically every time code is pushed to the repository,
# and can also be triggered manually from the Actions tab on GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out the project code
        uses: actions/checkout@v4

      - name: Configure the project with CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build LIGHTFINGERS (Release)
        run: cmake --build build --config Release

      - name: Find and package the built VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Filter "LIGHTFINGERS.vst3" -Directory | Select-Object -First 1
          if ($null -eq $vst3) {
            Write-Error "LIGHTFINGERS.vst3 was not found in the build output."
            exit 1
          }
          Write-Host "Found build output at: $($vst3.FullName)"
          Copy-Item -Recurse -Path $vst3.FullName -Destination "LIGHTFINGERS.vst3"

      - name: Upload the built plugin
        uses: actions/upload-artifact@v4
        with:
          name: LIGHTFINGERS-vst3-windows
          path: LIGHTFINGERS.vst3
          if-no-files-found: error
